<html lang="zh-Hant">

    <style>
        @font-face {
            font-family: 'SuifengPlus';
            src: url('./assets/ThePeakFontPlus-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'SuifengPlus', serif;
            background: linear-gradient(to bottom, #fff8e8, #f2e4c2);
            color: #2c1e16;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* 隱藏卷軸但保持滾動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 自定義淡入動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

        // 切換分頁邏輯 (SPA)
        function switchTab(tabId) {
            const container = document.getElementById('content-container');
            container.classList.remove('animate-fade-in');
            
            // 更新導覽按鈕狀態
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-[#8b261b]');
                btn.classList.add('text-[#4a3a31]');
                const underline = btn.querySelector('span');
                if (underline) underline.classList.remove('scale-x-100');
                if (underline) underline.classList.add('scale-x-0');
            });

            const activeBtn = document.getElementById(`nav-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-[#4a3a31]');
                activeBtn.classList.add('text-[#8b261b]');
                const activeUnderline = activeBtn.querySelector('span');
                if (activeUnderline) {
                    activeUnderline.classList.remove('scale-x-0');
                    activeUnderline.classList.add('scale-x-100');
                }
            }

            // 渲染對應內容
            setTimeout(() => {
                container.innerHTML = pages[tabId] || pages['history'];
                container.classList.add('animate-fade-in');
            }, 150);
        }

        // 初始化預設頁面
        switchTab('history');
    </script>
